name: key-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat > /tmp/probe.mjs << 'PROBE'
          import { createHmac } from "node:crypto";
          const KEY = process.env.BITGET_DEMO_KEY, SEC = process.env.BITGET_DEMO_SECRET, PASS = process.env.BITGET_DEMO_PASSPHRASE;
          async function call(host, method, path, pap) {
            const ts = Date.now().toString();
            const qs = path.includes("?") ? path.slice(path.indexOf("?")+1) : "";
            const msg = ts + method.toUpperCase() + path.split("?")[0] + qs;
            const sign = createHmac("sha256", SEC).update(msg).digest("base64");
            const headers = { "ACCESS-KEY": KEY, "ACCESS-SIGN": sign, "ACCESS-TIMESTAMP": ts, "ACCESS-PASSPHRASE": PASS, "Content-Type": "application/json", locale: "en-US" };
            if (pap) headers["paptrading"] = "1";
            try {
              const res = await fetch(host + path, { headers, signal: AbortSignal.timeout(8000) });
              console.log(`${pap ? "DEMO" : "LIVE"} ${host}${path} ->`, JSON.stringify(await res.json()).slice(0, 200));
            } catch (e) { console.log(`${pap ? "DEMO" : "LIVE"} ${host}${path} -> UNREACHABLE ${String(e).slice(0,60)}`); }
          }
          for (const host of ["https://api.bitget.com", "https://api.bitgetapp.com", "https://api.bitget.site"]) {
            await call(host, "GET", "/api/v2/spot/account/info", false);
            await call(host, "GET", "/api/v2/spot/account/info", true);
          }
          PROBE
          node /tmp/probe.mjs
        env:
          BITGET_DEMO_KEY: ${{ secrets.BITGET_DEMO_KEY }}
          BITGET_DEMO_SECRET: ${{ secrets.BITGET_DEMO_SECRET }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
